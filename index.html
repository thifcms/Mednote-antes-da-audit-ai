<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#18181b" />
    <meta name="google" content="notranslate" />
    <link rel="manifest" href="manifest.json?v=6" />
    <link rel="icon" type="image/svg+xml" href="icon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=6" />
    <link rel="apple-touch-icon" href="icon.svg?v=6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MedNote" />
    <title>MedNote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        // Recarrega a página UMA VEZ quando um novo service worker assume o
        // controle — garante que a versão mais recente do app é sempre
        // aplicada automaticamente, sem precisar de reload manual.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then((registration) => {
            // Checa ativamente se existe uma versão nova assim que o app abre,
            // em vez de depender só da checagem periódica automática do navegador.
            registration.update().catch(() => {});

            // Se já existir um worker esperando (baixado antes, mas ainda não
            // ativado), assume ele imediatamente.
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          }).catch(err => {
            console.error('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
